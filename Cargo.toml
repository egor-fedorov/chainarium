[workspace]
members = ["crates/chainarium-core", "crates/chainarium-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
ruint = "1.17"
num-bigint = "0.4"
num-traits = "0.2"
sha2 = "0.10"
rand_chacha = "0.3"
rand_core = "0.6"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
